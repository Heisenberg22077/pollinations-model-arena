<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Table — One Question, Every Model</title>
    <meta
      name="description"
      content="Ask one question and watch OpenAI, DeepSeek, Meta, xAI, Z.ai and FLUX answer side by side. Live latency, token count and Pollen cost per model. You pay with your own Pollen."
    />
    <meta name="theme-color" content="#d8cfc0" />
    <script>
      try {
        if (localStorage.getItem("model-table:color-mode") === "night") {
          document.documentElement.dataset.colorMode = "night";
          document.querySelector('meta[name="theme-color"]').content = "#161411";
        }
        if (
          localStorage.getItem("model-table:motion-paused") === "true" ||
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          document.documentElement.dataset.motion = "off";
        }
      } catch {}
    </script>
